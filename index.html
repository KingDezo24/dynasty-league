<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty League</title>
<meta name="description" content="Dynasty League: standings, power rankings, playoff odds, trades, picks, rule changes and the Clubhouse.">
<meta name="theme-color" content="#060a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dynasty">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
html[data-theme=dark]{--bg:#060a13;--glow1:rgba(56,124,255,.20);--glow2:rgba(34,211,238,.11);--grid:rgba(148,163,184,.055);--card:rgba(14,21,36,.80);--card2:rgba(255,255,255,.035);--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.26);--ink:#e8eef8;--ink2:#a9b5c9;--muted:#77849a;--accent:#4f9cff;--accent2:#22d3ee;--on-accent:#04101f;--head:rgba(148,163,184,.07);--zebra:rgba(148,163,184,.035);--hover:rgba(79,156,255,.08);--good:#34d399;--bad:#f87171;--warn:#fbbf24;--gold1:#f8dc7c;--gold2:#c08a2b;--shadow:0 12px 32px rgba(0,0,0,.38);--glass:rgba(6,10,19,.74);--chip:rgba(79,156,255,.15);--chip-ink:#a5ccff;--flash:rgba(52,211,153,.12);--danger-bg:rgba(248,113,113,.10);color-scheme:dark}
html[data-theme=light]{--bg:#eef2f8;--glow1:rgba(37,99,235,.11);--glow2:rgba(8,145,178,.08);--grid:rgba(15,23,42,.04);--card:rgba(255,255,255,.90);--card2:#f6f8fc;--line:#e1e7f0;--line2:#c9d3e1;--ink:#0b1324;--ink2:#46536a;--muted:#6b778c;--accent:#2563eb;--accent2:#0891b2;--on-accent:#fff;--head:#f2f5fa;--zebra:#fafbfd;--hover:rgba(37,99,235,.05);--good:#059669;--bad:#dc2626;--warn:#b45309;--gold1:#f2cc5b;--gold2:#a8701c;--shadow:0 10px 26px rgba(15,23,42,.08);--glass:rgba(255,255,255,.80);--chip:rgba(37,99,235,.10);--chip-ink:#1d4ed8;--flash:rgba(5,150,105,.10);--danger-bg:rgba(220,38,38,.07);color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 620px at 8% -12%,var(--glow1),transparent 62%),radial-gradient(900px 520px at 100% -5%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font:700 15px "Space Grotesk",sans-serif;color:#fff;letter-spacing:.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 6px 20px rgba(79,156,255,.35)}
.name{font:700 18px/1.2 "Space Grotesk",sans-serif;letter-spacing:-.2px}
.sub{font:500 11.5px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.tools{display:flex;align-items:center;gap:10px}
.synced{font:500 11.5px "JetBrains Mono",monospace;color:var(--muted);text-align:right}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;transition:border-color .15s,background .15s}
.iconbtn:hover{border-color:var(--accent);background:var(--hover)}
.iconbtn svg{width:18px;height:18px}
nav.wrap{display:flex;gap:4px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:transparent;border:1px solid transparent;color:var(--ink2);font:500 13.5px Inter,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .15s,background .15s,border-color .15s}
nav button:hover{color:var(--ink);background:var(--hover)}
nav button.on{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:600;box-shadow:0 4px 16px rgba(79,156,255,.35)}
nav button.club{border-color:var(--line2);color:var(--ink)}
nav button.club.on{border-color:transparent}
nav button .chev{width:12px;height:12px;transition:transform .2s}
nav button.open .chev{transform:rotate(180deg)}
.newtag{font:600 9.5px "JetBrains Mono",monospace;letter-spacing:.06em;padding:1px 5px;border-radius:5px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#2a1a00}
.menu{position:fixed;z-index:60;width:320px;max-width:calc(100vw - 24px);background:var(--card);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:none}
html[data-theme=dark] .menu{background:rgba(12,18,32,.97)}
html[data-theme=light] .menu{background:rgba(255,255,255,.98)}
.menu.show{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu .mh{font:600 10.5px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.mi{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.mi:hover,.mi.on{background:var(--hover);border-color:var(--line)}
.mi .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--chip);color:var(--chip-ink)}
.mi .ic svg{width:18px;height:18px}
.mi .t{font-weight:600;font-size:14px}
.mi .d{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:1px}
main.wrap{padding:26px 16px 36px}
.eyebrow{font:600 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1.pt{font:700 30px/1.15 "Space Grotesk",sans-serif;margin:0 0 6px;letter-spacing:-.6px}
h2.sect{font:600 20px "Space Grotesk",sans-serif;margin:30px 0 4px;letter-spacing:-.3px}
h3.sub3{font-size:14px;margin:16px 0 8px;color:var(--ink)}
.lede{color:var(--ink2);margin:0 0 6px;max-width:860px}
.status{color:var(--muted);font:500 12px "JetBrains Mono",monospace;margin:0 0 22px;letter-spacing:.02em}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow);min-width:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);pointer-events:none}
html[data-theme=light] .card:before{display:none}
.card h2{font:600 16px "Space Grotesk",sans-serif;margin:0 0 12px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.g2 .card,.g3 .card{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.tile{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.tile:after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tile.gold:after{background:linear-gradient(90deg,var(--gold1),var(--gold2))}
.tile .k{font:600 10.5px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-size:14.5px;font-weight:600;margin-top:4px}
ul.tips{margin:0;padding-left:18px;color:var(--ink2)}
ul.tips li{margin:5px 0}
p.note{color:var(--muted);font-size:13px;margin:10px 0 0}
p.watch{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:11px 13px;border-radius:10px;margin:12px 0 0;color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
select,input[type=search],.form input,.form textarea,.form select{font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--card2);color:var(--ink);max-width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,156,255,.18)}
select option{background:var(--bg);color:var(--ink)}
.filters input{min-width:200px;flex:1 1 220px}
.count{font:500 11.5px "JetBrains Mono",monospace;color:var(--muted);margin-left:auto}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{background:var(--head);color:var(--muted);text-align:left;font:600 11px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:10px 11px;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
.tbl th:hover{color:var(--ink)}
.tbl th.sorted{color:var(--accent)}
.tbl th.sorted:after{content:" \25BE"}
.tbl th.sorted.up:after{content:" \25B4"}
.tbl td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:top}
.tbl tbody tr:first-child td{border-top:0}
.tbl tr:nth-child(even) td{background:var(--zebra)}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.ml{white-space:pre-line;min-width:230px}
.tbl td.b{font-weight:600;white-space:nowrap}
.tbl tr.bye td{background:rgba(79,156,255,.16)}
.tbl tr.seed td{background:rgba(79,156,255,.07)}
.bar{height:6px;background:var(--line);border-radius:6px;min-width:90px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.chartbox{position:relative;height:380px}
.rule{border-top:1px solid var(--line);padding:13px 0}
.rule.first{border-top:0;padding-top:0}
.rule .h{font-weight:600}
.rule .sec{color:var(--accent);font:600 13px "JetBrains Mono",monospace;margin-right:8px}
.rule .w{margin:4px 0;color:var(--ink2)}
.rule .m{color:var(--ink2);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:7px}
.tag,.chip{display:inline-block;font:600 11px Inter,sans-serif;color:var(--chip-ink);background:var(--chip);border-radius:999px;padding:3px 10px;margin-top:6px}
.chip{margin:0}
.chip.good{background:rgba(52,211,153,.14);color:var(--good)}
.chip.bad{background:rgba(248,113,113,.13);color:var(--bad)}
.chip.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#2a1a00}
.chip.dim{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:minmax(150px,max-content) 1fr;gap:7px 18px;font-size:14px}
.kv .k{color:var(--muted)}
.empty{color:var(--muted)}
.pill{display:inline-flex;align-items:center;font:600 11px Inter,sans-serif;border-radius:999px;padding:3px 10px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#2a1a00}
footer.wrap{color:var(--muted);font:500 11.5px "JetBrains Mono",monospace;padding:0 16px 34px;position:relative;z-index:1}
.badge{display:inline-block;font:700 11px Inter,sans-serif;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:middle}
.b-low{background:var(--card2);color:var(--ink2);border:1px solid var(--line)}.b-mid{background:var(--chip);color:var(--chip-ink)}.b-high{background:rgba(251,146,60,.16);color:#fb923c}.b-urgent{background:#dc2626;color:#fff}
.b-status{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
.prop{border-top:1px solid var(--line);padding:15px 0}
.prop.first{border-top:0;padding-top:4px}
.prop h3{font-size:15.5px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin:0}
.ptext{margin:8px 0 6px;white-space:pre-line}
.pwhy{margin:6px 0;color:var(--ink2);white-space:pre-line}
.form{display:grid;gap:6px;max-width:720px}
.flabel{font-weight:600;font-size:13.5px;margin-top:8px}
.form input,.form textarea,.form select{width:100%;font-size:14.5px;padding:10px 12px}
.form .opt input{width:auto}
.btn{justify-self:start;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border:0;border-radius:11px;padding:10px 20px;font:600 14px Inter,sans-serif;cursor:pointer;margin-top:10px;box-shadow:0 6px 18px rgba(79,156,255,.3);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.msg{color:var(--accent);font-weight:600;margin:6px 0 0}
.warn{background:var(--danger-bg);border:1px solid rgba(248,113,113,.35);border-left:4px solid #dc2626;border-radius:10px;padding:12px 14px;margin-top:6px}
.warn p{margin:6px 0 10px;color:var(--ink2)}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 4px}
.opt{display:flex;align-items:flex-start;gap:6px;cursor:pointer}
.flash{background:var(--flash);border:1px solid rgba(52,211,153,.35);color:var(--good);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-weight:600}
.more{display:block;margin:6px auto 0}
/* Clubhouse */
.hero{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.15fr);gap:22px;align-items:center;overflow:hidden}
.hero .beltart{width:100%;max-width:440px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.35))}
.holder .k{font:600 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
html[data-theme=dark] .holder .k{color:var(--gold1)}
.holder .n{font:700 40px/1.05 "Space Grotesk",sans-serif;letter-spacing:-1px;margin:6px 0 2px}
.holder .tm{color:var(--ink2);font-size:15px}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:110px}
.stat .k{font:600 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:700 20px "Space Grotesk",sans-serif;margin-top:2px}
.fight{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;background:var(--card2)}
.fight .t{font:600 11px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.fight .m{font-weight:600;margin:4px 0 8px}
.split{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.split .a{background:linear-gradient(90deg,var(--gold2),var(--gold1))}
.split .b{background:var(--line2)}
.splitl{display:flex;justify-content:space-between;font:500 12px "JetBrains Mono",monospace;color:var(--muted);margin-top:5px}
.tl{position:relative;margin:4px 0 0;padding-left:20px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--gold1),var(--line))}
.tl .ev{position:relative;padding:8px 0 10px}
.tl .ev:before{content:"";position:absolute;left:-19px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--gold2)}
.tl .ev .w{font:500 11.5px "JetBrains Mono",monospace;color:var(--muted)}
.tl .ev .h{font-weight:600}
.tl .ev .s{color:var(--ink2);font-size:13.5px}
.trade{padding:0;overflow:hidden}
.trade .th{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line);background:var(--card2)}
.trade .th .no{font:600 12px "JetBrains Mono",monospace;color:var(--muted)}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.side{padding:14px 18px;border-right:1px solid var(--line)}
.side:last-child{border-right:0}
.side .o{font:600 16px "Space Grotesk",sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.side .tm{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.side .lbl{font:600 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.side ul{margin:0;padding-left:16px;color:var(--ink2);font-size:13.5px}
.side ul li{margin:2px 0}
.side .val{font:700 22px "Space Grotesk",sans-serif;margin-top:10px}
.side .val small{font:500 12px Inter,sans-serif;color:var(--muted);margin-left:4px}
.side.win .val{color:var(--good)}
.whatif{padding:12px 18px 14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.whatif b{color:var(--ink)}
.whatif .wl{margin:3px 0}
.side ul.iv{list-style:none;padding:0}
.side ul.iv li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.side ul.iv li:last-child{border-bottom:0}
.side ul.iv li .x{font:600 12.5px "JetBrains Mono",monospace;color:var(--ink);white-space:nowrap}
.side ul.iv li .x.z{color:var(--muted);font-weight:500}
.side .then{font-size:12.5px;color:var(--ink2);margin-top:2px}
.side .pts{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.side .pts b{color:var(--ink2)}
.vsplit{display:flex;height:6px;background:var(--line)}
.vsplit i{display:block;height:100%}
.vsplit .a{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.vsplit .b{background:linear-gradient(90deg,#fb8a4c,#f8dc7c)}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.segs button{background:var(--card2);border:1px solid var(--line2);color:var(--ink2);border-radius:999px;padding:7px 15px;font:600 13px Inter,sans-serif;cursor:pointer}
.segs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.calc{grid-template-columns:1fr}}
.cside{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.cside .ch{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.cside .ch b{font:600 15px "Space Grotesk",sans-serif;white-space:nowrap}
.cside .ch select{flex:1;min-width:0}
.cfind{position:relative}
.cfind input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink);outline:none}

  add(sy, el('span', 'live'));
  add(sy, document.createTextNode('Synced ' + D.meta.synced));
  document.getElementById('foot').textContent = 'Built from the league’s Sleeper data · refreshes every 6 hours · last synced ' + D.meta.synced;
}
var NAV_BUILT = false;
function buildNav() {
  if (NAV_BUILT) return;
  NAV_BUILT = true;
  var nav = document.getElementById('nav');
  PAGES.forEach(function (p) {
    var b = add(nav, el('button', null, p[1]));
    b.setAttribute('data-id', p[0]);
    if (p[0] === 'club') {
      b.className = 'club';
      add(b, el('span', 'newtag', 'NEW'));
      add(b, icon('chev'));
      b.onclick = function (ev) { ev.stopPropagation(); openMenu(b); };
    } else b.onclick = function () { show(p[0]); };
  });
  document.addEventListener('click', function (ev) { var m = document.getElementById('clubMenu'); if (!m.contains(ev.target)) closeMenu(); var sh = document.getElementById('sheet'); if (sh && !sh.contains(ev.target)) closeSheet(); });
  buildTabbar();
  window.addEventListener('resize', closeMenu);
  nav.addEventListener('scroll', closeMenu);
}
function startPage() {
  var hash = (location.hash || '').replace('#', '');
  if (hash && R[hash]) return hash;
  var start = 'home';
  try { start = sessionStorage.getItem('dl-page') || 'home'; } catch (e) {}
  return R[start] ? start : 'home';
}
function loadingScreen(msg, retry) {
  var main = document.getElementById('main');
  main.textContent = '';
  var box = add(main, el('div', 'loading'));
  var inner = add(box, el('div'));
  add(inner, el('div', 'logo', 'DL'));
  add(inner, el('div', null, msg || 'Loading league data…'));
  if (retry) { var b = add(inner, el('button', 'btn', 'Try again')); b.onclick = function () { loadingScreen(); fetchData(true); }; }
}
function fetchData(manual) {
  var btn = document.getElementById('refreshBtn');
  btn.className = 'iconbtn spin';
  var url = API_URL + '?api=data' + (TOKEN ? '&k=' + encodeURIComponent(TOKEN) : '');
  return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
    btn.className = 'iconbtn';
    if (!j || !j.data || !j.data.meta) throw new Error('No data yet');
    LAST_FETCH = Date.now();
    var first = !D || !D.meta;
    D = j.data; LIVE = j.live;
    var badToken = TOKEN && !(LIVE && LIVE.me);
    if (badToken) { TOKEN = ''; store('dl-token', null); }
    else if (LIVE && LIVE.me && LIVE.me.token && TOKEN !== LIVE.me.token) { TOKEN = LIVE.me.token; store('dl-token', TOKEN); }
    saveCache();
    setHeader(); buildNav();
    if (first) show(startPage());
    else if (manual || !TOUCHED || (CUR !== 'votes' && CUR !== 'pickem')) show(CUR, !manual);
    if (badToken) toast('Couldn’t sign you in. Pick your name again.');
    else if (manual) toast('Up to date · synced ' + D.meta.synced);
  }).catch(function () {
    btn.className = 'iconbtn';
    if (!D || !D.meta) loadingScreen('Can’t reach the league server right now.', true);
    else toast('You’re offline. Showing data from ' + D.meta.synced + '.');
  });
}
function registerWorker() {
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js'); } catch (e) {}
}
(function init() {
  var theme = 'dark';
  try { theme = localStorage.getItem('dl-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) {}
  setTheme(theme);
  document.getElementById('themeBtn').onclick = function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    if (D && D.meta) show(CUR, true);
  };
  document.getElementById('main').addEventListener('input', function () { TOUCHED = true; });
  document.getElementById('main').addEventListener('click', function () { TOUCHED = true; });
  if (IN_GAS) {
    setHeader(); buildNav();
    show(startPage());
    return;
  }
  // Installed app / app website: load data from the league server, showing the last copy right away.
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); DEFERRED = e; if (document.getElementById('installModal')) { closeInstall(); showInstall(true); } });
  window.addEventListener('appinstalled', function () { store('dl-install-never', '1'); closeInstall(); });
  TOKEN = URL_TOKEN || load('dl-token') || '';
  if (URL_TOKEN) store('dl-token', URL_TOKEN);
  var rb = document.getElementById('refreshBtn');
  rb.style.display = '';
  rb.innerHTML = ICONS.refresh;
  rb.onclick = function () { fetchData(true); };
  var cached = null;
  try { cached = JSON.parse(load('dl-cache') || 'null'); } catch (e) { cached = null; }
  if (cached && cached.data && cached.data.meta) {
    D = cached.data;
    LIVE = cached.live && cached.live.me && TOKEN && cached.live.me.token !== TOKEN ? null : cached.live;
    setHeader(); buildNav();
    show(startPage());
  } else loadingScreen();
  fetchData(false);
  registerWorker();
  setTimeout(function () { showInstall(false); }, 1200);
  window.addEventListener('hashchange', function () { var h = (location.hash || '').replace('#', ''); if (R[h] && h !== CUR && D && D.meta) show(h); });
  if (window.matchMedia) { var mq = window.matchMedia('(max-width: 640px)'), rr = function () { if (D && D.meta) show(CUR, true); }; if (mq.addEventListener) mq.addEventListener('change', rr); else if (mq.addListener) mq.addListener(rr); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && Date.now() - LAST_FETCH > 5 * 60 * 1000) fetchData(false); });
})();
</script>
